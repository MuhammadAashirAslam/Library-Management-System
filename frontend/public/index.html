<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Library Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="bg-white shadow-lg rounded-lg p-6 mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">DSA Library Management System</h1>
            <p class="text-gray-600">Built with C++ Backend and Node.js Frontend</p>
        </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4">Quick Stats</h2>
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Total Books</span>
                        <span id="totalBooks" class="text-2xl font-bold text-blue-600">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Total Users</span>
                        <span id="totalUsers" class="text-2xl font-bold text-green-600">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Transactions</span>
                        <span id="totalTransactions" class="text-2xl font-bold text-purple-600">0</span>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Quick Actions</h2>
                <div class="space-y-3">
                    <button onclick="showAddBookModal()" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                        Add New Book
                    </button>
                    <button onclick="showAddUserModal()" class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition duration-200">
                        Add New User
                    </button>
                    <button onclick="showBorrowModal()" class="w-full bg-purple-600 text-white py-2 px-4 rounded-lg hover:bg-purple-700 transition duration-200">
                        Borrow Book
                    </button>
                    <button onclick="showReturnModal()" class="w-full bg-orange-600 text-white py-2 px-4 rounded-lg hover:bg-orange-700 transition duration-200">
                        Return Book
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Search</h2>
                <div class="space-y-3">
                    <input type="text" id="searchQuery" placeholder="Search books or users..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="performSearch()" class="w-full bg-gray-600 text-white py-2 px-4 rounded-lg hover:bg-gray-700 transition duration-200">
                        Search
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md mb-8">
            <div class="p-6 border-b border-gray-200">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-semibold text-gray-800">Library Management</h2>
                    <div class="flex space-x-2">
                        <button onclick="showTab('books')" id="booksTab" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Books</button>
                        <button onclick="showTab('users')" id="usersTab" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Users</button>
                        <button onclick="showTab('transactions')" id="transactionsTab" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Transactions</button>
                    </div>
                </div>
            </div>

            <div id="booksSection" class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800">Books</h3>
                    <div class="flex space-x-2">
                        <select id="bookSortCriteria" class="px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="title">Sort by Title</option>
                            <option value="author">Sort by Author</option>
                            <option value="publicationYear">Sort by Year</option>
                            <option value="isbn">Sort by ISBN</option>
                        </select>
                        <button onclick="sortBooks()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Sort</button>
                    </div>
                </div>
                <div id="booksList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <div id="usersSection" class="p-6 hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800">Users</h3>
                    <div class="flex space-x-2">
                        <select id="userSortCriteria" class="px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="name">Sort by Name</option>
                            <option value="userId">Sort by ID</option>
                            <option value="email">Sort by Email</option>
                        </select>
                        <button onclick="sortUsers()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Sort</button>
                    </div>
                </div>
                <div id="usersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <div id="transactionsSection" class="p-6 hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800">Transactions</h3>
                    <div class="flex space-x-2">
                        <select id="transactionSortCriteria" class="px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="timestamp">Sort by Date</option>
                            <option value="userId">Sort by User</option>
                            <option value="bookISBN">Sort by Book ISBN</option>
                            <option value="type">Sort by Type</option>
                        </select>
                        <button onclick="sortTransactions()" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">Sort</button>
                    </div>
                </div>
                <div id="transactionsList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- Add Book Modal -->
    <div id="addBookModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Add New Book</h3>
            <form onsubmit="addBook(event)">
                <div class="space-y-4">
                    <input type="text" id="newBookISBN" placeholder="ISBN" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="newBookTitle" placeholder="Title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="newBookAuthor" placeholder="Author" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" id="newBookYear" placeholder="Publication Year" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" id="newBookCopies" placeholder="Number of Copies" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex justify-end space-x-2 mt-6">
                    <button type="button" onclick="closeModal('addBookModal')" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Add Book</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="addUserModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Add New User</h3>
            <form onsubmit="addUser(event)">
                <div class="space-y-4">
                    <input type="text" id="newUserId" placeholder="User ID" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    <input type="text" id="newUserName" placeholder="Name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    <input type="email" id="newUserEmail" placeholder="Email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    <input type="text" id="newUserPhone" placeholder="Phone" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div class="flex justify-end space-x-2 mt-6">
                    <button type="button" onclick="closeModal('addUserModal')" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Add User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Borrow Book Modal -->
    <div id="borrowModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Borrow Book</h3>
            <form onsubmit="borrowBook(event)">
                <div class="space-y-4">
                    <input type="text" id="borrowUserId" placeholder="User ID" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <input type="text" id="borrowBookISBN" placeholder="Book ISBN" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="flex justify-end space-x-2 mt-6">
                    <button type="button" onclick="closeModal('borrowModal')" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">Borrow</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Return Book Modal -->
    <div id="returnModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Return Book</h3>
            <form onsubmit="returnBook(event)">
                <div class="space-y-4">
                    <input type="text" id="returnUserId" placeholder="User ID" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <input type="text" id="returnBookISBN" placeholder="Book ISBN" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div class="flex justify-end space-x-2 mt-6">
                    <button type="button" onclick="closeModal('returnModal')" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700">Return</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
